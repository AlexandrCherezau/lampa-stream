name = "lampa-rooms"
main = "rooms-worker.mjs"
compatibility_date = "2026-10-11"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Room creation per client address.
[[ratelimits]]
name = "CREATE_LIMIT"
namespace_id = "1001"
simple = { limit = 20, period = 60 }
