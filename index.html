<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <title>Lampa-Stream</title>
        <!-- Absolute path: "./logo.png" resolves against the DOCUMENT url, so
             on a deep-linked /movie/<id> load the favicon 404s. The SVG is
             24 KB vs the PNG's 71 KB and Chrome fetches favicons at high
             priority — it was competing with the CSS/JS on the critical path. -->
        <link rel="icon" type="image/svg+xml" href="/logo.svg" />
        <!-- Preload the UI font: it was discovered only AFTER the render-blocking
             global.css was downloaded and parsed, so the correct font could not
             paint until one extra RTT later (font-display:swap turns that into a
             visible reflow on every cold load). -->
        <link rel="preload" href="/src/styles/fonts/dm-sans-regular.woff2" as="font" type="font/woff2" crossorigin />
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
