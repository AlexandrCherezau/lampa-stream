<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <title>Nahflix</title>
        <meta name="theme-color" content="#0b0c0d" />
        <!-- Absolute path: "./logo.png" resolves against the DOCUMENT url, so
             on a deep-linked /movie/<id> load the favicon 404s. Kept under 3 KB:
             Chrome fetches favicons at high priority, competing with the CSS/JS
             on the critical path. -->
        <link rel="icon" type="image/png" href="/app-icons/favicon-64.png" />
        <!-- Home-screen install. iOS ignores the manifest for the icon and launch
             screen, so both need their own tags; scripts/generate-app-icons.mjs
             renders the images and prints the launch-screen tags. -->
        <link rel="manifest" href="/app-icons/manifest.webmanifest" />
        <link rel="apple-touch-icon" href="/app-icons/apple-touch-icon.png" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-title" content="Nahflix" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

        <!-- Paints before the stylesheet arrives, so the launch screen does not
             flash white on its way into the app. -->
        <style>html { background: #0b0c0d; }</style>
        <!-- Preload the UI font: it was discovered only AFTER the render-blocking
             global.css was downloaded and parsed, so the correct font could not
             paint until one extra RTT later (font-display:swap turns that into a
             visible reflow on every cold load). -->
        <link rel="preload" href="/src/styles/fonts/onest-cyrillic-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
