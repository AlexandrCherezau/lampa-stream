<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="440" viewBox="0 0 1440 440" role="img" aria-labelledby="title desc">
  <title id="title">Lampa-Stream — кино, сериалы и аниме</title>
  <desc id="desc">Тёмная обложка с красным акцентом, кнопкой воспроизведения и названием проекта.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111116"/><stop offset="1" stop-color="#09090b"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#e50932" stop-opacity=".32"/><stop offset="1" stop-color="#e50932" stop-opacity="0"/></radialGradient>
    <linearGradient id="red" x2="1" y2="1"><stop stop-color="#ff3656"/><stop offset="1" stop-color="#e50914"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".025"/></pattern>
  </defs>
  <rect width="1440" height="440" rx="24" fill="url(#bg)"/>
  <rect width="1440" height="440" rx="24" fill="url(#grid)"/>
  <ellipse cx="1100" cy="240" rx="410" ry="330" fill="url(#glow)"/>
  <rect x=".5" y=".5" width="1439" height="439" rx="24" fill="none" stroke="#ffffff" stroke-opacity=".1"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="64" y="54" width="230" height="31" rx="15.5" fill="#e50914" fill-opacity=".12" stroke="#ff3656" stroke-opacity=".35"/>
    <circle cx="84" cy="69.5" r="4" fill="#ff3656"/>
    <text x="100" y="74" font-size="12" font-weight="700" letter-spacing="2" fill="#ff7e91">PRESS PLAY. STAY.</text>
    <text x="59" y="177" font-size="86" font-weight="800" letter-spacing="-4" fill="#f5f5f7">LAMPA<tspan fill="#ff3656">—</tspan>STREAM</text>
    <text x="65" y="222" font-size="26" fill="#d8d8e0">Включай. Смотри. Возвращайся.</text>
    <text x="65" y="261" font-size="17" fill="#8d8d9b">Фильмы, сериалы и аниме в одном месте.</text>
    <g font-size="12" font-weight="700" letter-spacing="1.2" fill="#c6c6d0">
      <rect x="64" y="306" width="154" height="36" rx="8" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".1"/>
      <text x="84" y="329">РУССКАЯ ОЗВУЧКА</text>
      <rect x="228" y="306" width="115" height="36" rx="8" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".1"/>
      <text x="250" y="329">WEB PLAYER</text>
      <rect x="353" y="306" width="127" height="36" rx="8" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".1"/>
      <text x="373" y="329">OPEN SOURCE</text>
    </g>
    <text x="65" y="400" font-size="12" letter-spacing="2" fill="#646471">YOUR SCREEN. YOUR STORIES.</text>
  </g>
  <g transform="translate(1108 210)">
    <circle r="146" fill="none" stroke="#ff3656" stroke-opacity=".1"/>
    <circle r="118" fill="none" stroke="#ff3656" stroke-opacity=".2" stroke-dasharray="3 12"/>
    <rect x="-77" y="-77" width="154" height="154" rx="44" fill="#140d12" stroke="#ff3656" stroke-opacity=".55"/>
    <rect x="-60" y="-60" width="120" height="120" rx="34" fill="url(#red)"/>
    <path d="M-17-29 33 0-17 29Z" fill="#ffffff" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="133" cy="-60" r="5" fill="#ff3656"/><circle cx="-113" cy="105" r="3" fill="#ff7e91"/>
    <path d="M-115 186H115" stroke="#ffffff" stroke-opacity=".12" stroke-width="4" stroke-linecap="round"/>
    <path d="M-115 186H-23" stroke="#ff3656" stroke-width="4" stroke-linecap="round"/>
    <circle cx="-23" cy="186" r="6" fill="#ff3656"/>
  </g>
</svg>
