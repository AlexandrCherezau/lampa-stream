{
  "listen": {
    "version": true,
    "ResponseCancelAfter": 50,
    "ip": "127.0.0.1",
    "port": 9118,
    "scheme": "http",
    "localhost": "127.0.0.1"
  },
  "BaseModule": {
    "LoadModules": ["Online", "OnlineRUS", "OnlineAnime", "OnlinePaid", "Kit"],
    "SkipModules": [
      "Catalog", "Tracks", "Transcoding", "WebLog", "CacheMedia", "ForkPlayerXML",
      "MsxNative", "Potok", "TelegramAuth", "TelegramAuthBot", "QRAuth", "SeriesNotify",
      "SISI", "Adult", "DLNA", "GStreamer", "AdminPanel", "LampaWeb", "JacRed",
      "TorrServer", "Sync", "TimeCode", "DatabaseEditor", "ExternalBind", "Music",
      "Telemetry", "WatchTogether", "Community", "NextHUB", "OnlineENG", "OnlineGEO",
      "OnlineUKR", "PidTor"
    ]
  },
  "chromium": {
    "enable": true,
    "Headless": false,
    "count": 1,
    "executablePath": "/usr/bin/chromium",
    "Args": ["--no-sandbox", "--disable-dev-shm-usage", "--disable-blink-features=AutomationControlled"]
  },
  "Rezka": {
    "enable": false,
    "host": "https://rezka.ag",
    "premium": false,
    "scheme": "https"
  },
  "Zetflix": {
    "enable": true
  },
  "ZetflixDB": {
    "enable": true
  },
  "VkMovie": {
    "enable": true
  },
  "RutubeMovie": {
    "enable": true
  },
  "VideoDB": {
    "cdp": "http://127.0.0.1:9222",
    "httptimeout": 30
  }
}
